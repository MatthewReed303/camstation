include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - reference/**
    - engine_bin/**
    - build/**
    - android/**
    - windows/**
    - linux/**

linter:
  rules:
    # App code, not a published package: API docs on every public member is noise.
    public_member_api_docs: false
    # Keep conventional `ClassName(...)` constructors rather than Dart 3.13's
    # `new(...)` shorthand: more familiar to contributors and to tooling.
    unnecessary_type_name_in_constructor: false
